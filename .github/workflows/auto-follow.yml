name: Follow automático no Bluesky

on:
  schedule:
    - cron: '17 * * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-follow-bsky
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Buscar e seguir perfis
        run: node auto-follow.mjs --execute
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
